# Builds the app and publishes it on GitHub Pages at every push to main.
# Repository settings: Settings -> Pages -> Source: GitHub Actions.
name: Publish the app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pyodide files are downloaded from its CDN and checked (SHA-256) by build.py
      - run: python3 web/build.py --self-host-pyodide --source-url "${{ github.server_url }}/${{ github.repository }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
